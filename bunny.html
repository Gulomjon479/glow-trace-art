<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jonli Quyon — Suhbatdosh AI Do'st</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="fx/fx.css?v=1" />
  <script src="fx/nav.js?v=1"></script>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }</script>
  <style>
    body.bunny-page {
      margin: 0; min-height: 100dvh;
      background: radial-gradient(circle at 30% 25%, #1d1238 0%, #090614 65%, #04030a 100%);
      color: #eef2ff;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex; flex-direction: column; overflow-x: hidden;
    }
    .bunny-shell {
      flex: 1; width: 100%; max-width: 1020px; margin: 0 auto;
      padding: 14px; display: grid; grid-template-columns: 400px 1fr;
      gap: 16px; align-items: start; box-sizing: border-box;
    }
    .bunny-stage-card {
      position: relative; width: 100%; border-radius: 24px;
      background: radial-gradient(circle at 50% 42%, rgba(139,92,246,0.22), rgba(15,11,30,0.85) 72%);
      border: 1px solid rgba(190,200,255,0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 0 40px rgba(167,139,250,0.1);
      overflow: hidden; cursor: pointer;
    }
    #bunnyCanvas { width: 100%; height: 420px; display: block; }
    .bunny-top-pill {
      position: absolute; top: 11px; left: 11px; right: 11px;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    }
    .bunny-name-badge {
      padding: 6px 12px; border-radius: 999px;
      background: rgba(10,8,22,0.72); border: 1px solid rgba(190,200,255,0.22);
      font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .bunny-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .bunny-sleep-dot { background: #818cf8; box-shadow: 0 0 8px #818cf8; }
    .bunny-voice-btn {
      pointer-events: auto; border: 1px solid rgba(190,200,255,0.25);
      background: rgba(10,8,22,0.75); color: #fff;
      border-radius: 999px; padding: 6px 11px; font-size: 12px; cursor: pointer;
    }
    .bunny-actions-bar {
      padding: 10px 10px 12px; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
      background: linear-gradient(0deg, rgba(10,8,22,0.85), transparent);
    }
    .bunny-act-btn {
      border: 1px solid rgba(200,210,255,0.22); background: rgba(14,11,28,0.82);
      color: #eef2ff; border-radius: 999px; padding: 7px 13px;
      font-size: 12.5px; font-weight: 600; cursor: pointer;
      transition: transform 0.14s, border-color 0.18s;
    }
    .bunny-act-btn:hover { border-color: rgba(216,180,254,0.65); background: rgba(80,40,120,0.4); }
    .bunny-act-btn:active { transform: scale(0.94); }
    .bunny-chat-card {
      border-radius: 24px; background: rgba(14,11,28,0.84);
      border: 1px solid rgba(190,200,255,0.16);
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      height: 540px;
    }
    .bunny-chat-head {
      padding: 13px 16px; border-bottom: 1px solid rgba(190,200,255,0.12);
      display: flex; justify-content: space-between; align-items: center;
    }
    .bunny-chat-head h2 { margin: 0; font-size: 15px; }
    .bunny-mood-tag {
      font-size: 12px; color: #c4b5fd;
      background: rgba(139,92,246,0.18); padding: 4px 10px; border-radius: 999px;
      transition: all 0.3s ease;
    }
    .bunny-messages { flex: 1; overflow-y: auto; padding: 13px; display: flex; flex-direction: column; gap: 9px; }
    .bunny-messages::-webkit-scrollbar { width: 4px; }
    .bunny-messages::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 4px; }
    .b-msg {
      max-width: 86%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.5; animation: popIn 0.2s ease;
    }
    @keyframes popIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
    .b-msg.bunny {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(59,130,246,0.18));
      border: 1px solid rgba(196,181,253,0.25); border-bottom-left-radius: 4px;
    }
    .b-msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(236,72,153,0.26), rgba(168,85,247,0.26));
      border: 1px solid rgba(244,114,182,0.25); border-bottom-right-radius: 4px;
    }
    .b-msg.typing { font-style: italic; opacity: 0.65; }
    .bunny-input-row {
      padding: 10px 11px; border-top: 1px solid rgba(190,200,255,0.12);
      display: flex; gap: 7px; align-items: center; background: rgba(8,6,18,0.65);
    }
    .bunny-input-row input {
      flex: 1; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(190,200,255,0.2); border-radius: 14px;
      padding: 10px 13px; color: #fff; font-size: 14px; outline: none;
    }
    .bunny-input-row input:focus { border-color: rgba(196,181,253,0.65); }
    .bunny-send-btn, .bunny-mic-btn {
      border: none; border-radius: 14px; padding: 10px 14px;
      font-weight: 700; font-size: 14px; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
    }
    .bunny-mic-btn {
      background: rgba(255,255,255,0.09); border: 1px solid rgba(190,200,255,0.22); padding: 10px 12px;
    }
    .bunny-mic-btn.listening { background: rgba(239,68,68,0.45); border-color: #f87171; }
    @media (max-width: 860px) {
      .bunny-shell { grid-template-columns: 1fr; padding: 8px; gap: 9px; }
      #bunnyCanvas { height: 280px; }
      .bunny-chat-card { height: calc(100dvh - var(--nav-h) - 330px); min-height: 240px; }
    }
  </style>
</head>
<body class="bunny-page" data-section="bunny">
  <div class="bunny-shell">
    <div class="bunny-stage-card" id="bunnyStage">
      <canvas id="bunnyCanvas"></canvas>
      <div class="bunny-top-pill">
        <span class="bunny-name-badge"><span class="bunny-dot" id="statusDot"></span>Quvonch 🐰</span>
        <button class="bunny-voice-btn" id="voiceToggleBtn" type="button">🔊 Ovoz</button>
      </div>
      <div class="bunny-actions-bar">
        <button class="bunny-act-btn" id="carrotBtn"   type="button">🥕 Sabzi</button>
        <button class="bunny-act-btn" id="petBtn"      type="button">🤍 Erkalash</button>
        <button class="bunny-act-btn" id="danceBtn"    type="button">💃 Raqsga tush</button>
        <button class="bunny-act-btn" id="waveBtn"     type="button">👋 Salom ayt</button>
        <button class="bunny-act-btn" id="sleepBtn"    type="button">😴 Uxlatish</button>
        <button class="bunny-act-btn" id="wakeBtn"     type="button">☀️ Uyg'otish</button>
        <button class="bunny-act-btn" id="askMeBtn"    type="button">🎲 Qiziq savol</button>
        <button class="bunny-act-btn" id="jokeBtn"     type="button">😄 Hazil ayt</button>
        <button class="bunny-act-btn" id="factBtn"     type="button">🧠 Qiziq fakt</button>
        <button class="bunny-act-btn" id="confessBtn"  type="button">🌸 Sir aytish</button>
      </div>
    </div>

    <div class="bunny-chat-card">
      <div class="bunny-chat-head">
        <h2>💬 Quvonch bilan suhbat</h2>
        <span class="bunny-mood-tag" id="moodTag">✨ Quvnoq</span>
      </div>
      <div class="bunny-messages" id="chatBox"></div>
      <form class="bunny-input-row" id="chatForm">
        <button class="bunny-mic-btn" id="micBtn" type="button" title="Ovoz bilan gapirish">🎤</button>
        <input id="chatInput" type="text" placeholder="Quvonchga biror narsa yozing..." autocomplete="off" />
        <button class="bunny-send-btn" type="submit">➤</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { Bunny3D } from './fx/bunny3d.js';

    try { const tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); } } catch(e) {}

    const canvas  = document.getElementById('bunnyCanvas');
    const stage   = document.getElementById('bunnyStage');
    const chatBox = document.getElementById('chatBox');
    const chatForm= document.getElementById('chatForm');
    const chatInput=document.getElementById('chatInput');
    const moodTag = document.getElementById('moodTag');
    const voiceBtn= document.getElementById('voiceToggleBtn');
    const micBtn  = document.getElementById('micBtn');
    const statusDot=document.getElementById('statusDot');

    const bunny = new Bunny3D(canvas);
    let voiceOn = true;
    const history = [];
    const tgUser  = window.Telegram?.WebApp?.initDataUnsafe?.user || {};
    const userName= tgUser.first_name || '';

    const MOOD_LABELS = {
      happy:'✨ Quvnoq', curious:'🧐 Qiziquvchan', excited:'🤩 Hayajonda',
      laughing:'😄 Kulmoqda', shy:'🥰 Uyatchan', thinking:'🤔 O'ylanmoqda',
    };

    // Pointer tracking → eye follow
    window.addEventListener('pointermove', (e)=>{
      const r = stage.getBoundingClientRect();
      bunny.setLook(((e.clientX-r.left)/r.width-0.5)*2, ((e.clientY-r.top)/r.height-0.5)*2);
    });
    window.addEventListener('touchmove', (e)=>{
      if (e.touches[0]) {
        const r = stage.getBoundingClientRect();
        bunny.setLook(((e.touches[0].clientX-r.left)/r.width-0.5)*2,
                      ((e.touches[0].clientY-r.top)/r.height-0.5)*2);
      }
    }, { passive:true });

    let lastT = performance.now();
    (function loop(now){ requestAnimationFrame(loop); bunny.update(Math.min(0.05,(now-lastT)/1000), now*.001); lastT=now; })();

    // ---- TTS ----
    function speakText(text){
      bunny.speaking = true;
      const clean = text.replace(/[\u{1F300}-\u{1FAFF}🐰🥕💬🤍]/gu,'').trim();
      const ms = Math.min(5000, Math.max(900, clean.length*50));
      if (voiceOn && 'speechSynthesis' in window && clean){
        try{
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang='uz-UZ'; u.pitch=1.3; u.rate=1.05;
          u.onend=()=>{ bunny.speaking=false; };
          u.onerror=()=>{ bunny.speaking=false; };
          speechSynthesis.speak(u);
          setTimeout(()=>{ bunny.speaking=false; }, ms+1800);
          return;
        } catch(e){}
      }
      setTimeout(()=>{ bunny.speaking=false; }, ms);
    }

    // ---- Chat UI ----
    let typingEl = null;
    function addMsg(who, text){
      if (typingEl){ typingEl.remove(); typingEl=null; }
      const d = document.createElement('div');
      d.className='b-msg '+who;
      d.textContent=text;
      chatBox.appendChild(d);
      chatBox.scrollTop=chatBox.scrollHeight;
      return d;
    }
    function showTyping(){
      if (typingEl) return;
      typingEl = document.createElement('div');
      typingEl.className='b-msg bunny typing';
      typingEl.textContent='🐰 Yozmoqda…';
      chatBox.appendChild(typingEl);
      chatBox.scrollTop=chatBox.scrollHeight;
    }
    function setMoodUI(mood){
      bunny.setMood(mood);
      moodTag.textContent = MOOD_LABELS[mood] || MOOD_LABELS.happy;
      statusDot.className = 'bunny-dot' + (mood==='shy'?' bunny-sleep-dot':'');
    }

    async function sendToBunny(message, action=''){
      if (message){ addMsg('user',message); history.push({role:'user',text:message}); }
      showTyping();
      setMoodUI('thinking');
      try{
        const res = await fetch('/api/bunny-chat',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ message, action, history:history.slice(-12), userName }),
        });
        const data = await res.json();
        const reply = data.reply || 'Voy, quloqlarim qimirlab ketdi! Yana bir marta yozib ko'ring 🐰';
        setMoodUI(data.mood||'happy');
        addMsg('bunny', reply);
        history.push({role:'bunny',text:reply});
        speakText(reply);
      } catch(e){
        addMsg('bunny','Voy, internetim biroz siltandi — qayta yozib ko'ring! 🐰');
        setMoodUI('curious');
      }
    }

    // ---- Button actions ----
    chatForm.addEventListener('submit', e=>{
      e.preventDefault();
      const t = chatInput.value.trim(); if(!t) return;
      chatInput.value=''; sendToBunny(t);
    });
    const btn=(id,fn)=> document.getElementById(id).addEventListener('click', e=>{ e.stopPropagation(); fn(); });

    btn('carrotBtn',  ()=>{ bunny.triggerCarrot(); sendToBunny('','carrot'); });
    btn('petBtn',     ()=>{ bunny.triggerHop(2); bunny.burstHearts(); sendToBunny('','pet'); });
    btn('danceBtn',   ()=>{ bunny.triggerDance(); sendToBunny('','dance'); });
    btn('waveBtn',    ()=>{ bunny.triggerWave(); sendToBunny('','wave'); });
    btn('sleepBtn',   ()=>{ bunny.triggerSleep(); sendToBunny('','sleep'); });
    btn('wakeBtn',    ()=>{ bunny.sleeping=false; bunny.triggerHop(1); sendToBunny('','wake'); });
    btn('askMeBtn',   ()=> sendToBunny('','curious_question'));
    btn('jokeBtn',    ()=> sendToBunny('','joke'));
    btn('factBtn',    ()=> sendToBunny('','fun_fact'));
    btn('confessBtn', ()=>{ bunny.setMood('shy'); sendToBunny('','confess'); });

    canvas.addEventListener('click', ()=>{ bunny.triggerHop(1); bunny.burstHearts(); sendToBunny('','pet'); });

    voiceBtn.addEventListener('click', e=>{
      e.stopPropagation();
      voiceOn=!voiceOn;
      voiceBtn.textContent = voiceOn ? '🔊 Ovoz' : '🔇 Ovoz o'ch';
      if (!voiceOn && speechSynthesis) speechSynthesis.cancel();
    });

    // ---- Mic ----
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR){
      const rec = new SR(); rec.lang='uz-UZ'; rec.interimResults=false;
      micBtn.addEventListener('click', ()=>{ try{ micBtn.classList.add('listening'); rec.start(); } catch(e){ micBtn.classList.remove('listening'); } });
      rec.onresult = ev=>{ micBtn.classList.remove('listening'); const s=ev.results[0]?.[0]?.transcript; if(s) sendToBunny(s); };
      rec.onerror=rec.onend=()=> micBtn.classList.remove('listening');
    } else { micBtn.style.display='none'; }

    // ---- Initial greeting ----
    const hello = userName
      ? `Salom, ${userName}! 🐰 Mening ismim Quvonch — sening bilan xuddi yoningda o'tirgandek jonli suhbatlashaman! Quloqlarim ham dikkayib senga qarab turibdi. Bugun kayfiyating qanday, do'stim?`
      : `Salom! 🐰 Mening ismim Quvonch! Men oddiy bot emas — sening bilan qiziqib, kulib, hayajonlanib gaplashadigan jonli quyonchanman. Isming nima, va bugun kuning qanday o'tyapti?`;
    addMsg('bunny', hello);
    history.push({role:'bunny',text:hello});
    speakText(hello);
  </script>
</body>
</html>
